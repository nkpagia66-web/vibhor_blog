  <text x="122" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#4ade80">Available for freelance &amp; remote work</text>
  <text x="1128" y="546" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f4f4f5" text-anchor="end">vibhoragarwal.blog</text>
