  <text x="72" y="252" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#f4f4f5">Websites &amp; Digital Experiences</text>
  <text x="72" y="330" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="url(#accent)">That Help Businesses Grow</text>
  <text x="72" y="404" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#a1a1aa">Fast, modern, production-ready websites, e-commerce</text>
  <text x="72" y="444" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#a1a1aa">and full-stack applications.</text>
